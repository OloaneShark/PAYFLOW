syntax = "proto3";

package payflow.v1;

option go_package = "payflow/gen/go/payflow/v1;payflowv1";

import "google/protobuf/timestamp.proto";

// PaymentService creates and retrieves simulated payments. Simulation methods
// are disabled by default and may be enabled only on a loopback development server.
service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc SimulatePayment(SimulatePaymentRequest) returns (SimulatePaymentResponse);
  rpc ReconcilePayment(ReconcilePaymentRequest) returns (ReconcilePaymentResponse);
}

message CreatePaymentRequest {
  string merchant_id = 1;
  string idempotency_key = 2;
  int64 amount = 3;
  string currency = 4;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message SimulatePaymentRequest {
  string payment_id = 1;
  SimulationScenario scenario = 2;
}

message SimulatePaymentResponse {
  Payment payment = 1;
}

message ReconcilePaymentRequest {
  string payment_id = 1;
}

message ReconcilePaymentResponse {
  Payment payment = 1;
}

message Payment {
  string payment_id = 1;
  string merchant_id = 2;
  int64 amount = 3;
  string currency = 4;
  PaymentStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string provider_operation_id = 8;
  google.protobuf.Timestamp processing_started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  google.protobuf.Timestamp failed_at = 11;
  google.protobuf.Timestamp reconciliation_required_at = 12;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_CREATED = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_COMPLETED = 3;
  PAYMENT_STATUS_FAILED = 4;
  PAYMENT_STATUS_RECONCILIATION_REQUIRED = 5;
}

enum SimulationScenario {
  SIMULATION_SCENARIO_UNSPECIFIED = 0;
  SIMULATION_SCENARIO_APPROVE = 1;
  SIMULATION_SCENARIO_DECLINE = 2;
  SIMULATION_SCENARIO_TEMPORARY_FAILURE = 3;
  SIMULATION_SCENARIO_NETWORK_TIMEOUT = 4;
  SIMULATION_SCENARIO_LOST_APPROVAL_RESPONSE = 5;
}
