name: payflow-loadtest

# Isolated from the normal development project, ports, and named volumes.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow_loadtest_smoke
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow_loadtest_smoke"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - loadtest_pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/temporal:1.9.1
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.db"]
    ports:
      - "127.0.0.1:17233:7233"
      - "127.0.0.1:18233:8233"
    volumes:
      - loadtest_temporaldata:/var/lib/temporal

volumes:
  loadtest_pgdata:
  loadtest_temporaldata:
