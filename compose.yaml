services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - payflow_pgdata:/var/lib/postgresql/data

volumes:
  payflow_pgdata:
