name: Manual local performance and race verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate local alert rules
        run: |
          docker run --rm -v "$PWD/docs:/etc/payflow:ro" --entrypoint /bin/promtool prom/prometheus:v3.7.3 check rules /etc/payflow/alerts.yml
          docker run --rm -v "$PWD/docs:/etc/payflow:ro" --entrypoint /bin/promtool prom/prometheus:v3.7.3 test rules /etc/payflow/alerts.test.yml
      - name: Run isolated smoke and CGO race suite
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.loadtest.yaml up -d --wait
          api_pid=''
          worker_pid=''
          cleanup() {
            if [ -n "$api_pid" ]; then kill "$api_pid" 2>/dev/null || true; fi
            if [ -n "$worker_pid" ]; then kill "$worker_pid" 2>/dev/null || true; fi
            docker compose -f compose.loadtest.yaml down
          }
          trap cleanup EXIT
          export DATABASE_URL='postgres://payflow:payflow@127.0.0.1:15432/payflow_loadtest_smoke?sslmode=disable'
          export PAYFLOW_ENV=development
          export TEMPORAL_ADDRESS=127.0.0.1:17233
          go run ./cmd/migrate
          mkdir -p bin
          go build -o bin/api ./cmd/api
          go build -o bin/worker ./cmd/worker
          go build -o bin/loadtest ./cmd/loadtest
          PAYFLOW_LOADTEST_MODE=true LISTEN_ADDR=127.0.0.1:18080 PAYFLOW_METRICS_ADDR=127.0.0.1:19090 ./bin/api >api.log 2>&1 &
          api_pid=$!
          PAYFLOW_WORKER_METRICS_ADDR=127.0.0.1:19091 ./bin/worker >worker.log 2>&1 &
          worker_pid=$!
          ready=false
          for _ in $(seq 1 100); do
            if curl -fsS -D - -o /dev/null http://127.0.0.1:18080/healthz | grep -qi 'X-Payflow-Loadtest-Database: payflow_loadtest_smoke'; then
              ready=true
              break
            fi
            sleep 0.1
          done
          test "$ready" = true
          PAYFLOW_LOADTEST_DATABASE_URL="$DATABASE_URL" ./bin/loadtest -allow-local-test -preset smoke -workload mixed -requests 12 -clients 2 -output-dir results/loadtest
          cat results/loadtest/*.md
          kill "$api_pid" "$worker_pid"
          wait "$api_pid" "$worker_pid" 2>/dev/null || true
          api_pid=''
          worker_pid=''
          export TEST_DATABASE_URL="$DATABASE_URL"
          export TEST_TEMPORAL_ADDRESS=127.0.0.1:17233
          CGO_ENABLED=1 go test -race -count=1 ./...
